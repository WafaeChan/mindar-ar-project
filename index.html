<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MindAR Video with Target Detection</title>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; background: black; }
      #start-button {
        position: absolute;
        z-index: 10;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 20px 40px;
        font-size: 18px;
        background-color: #1e90ff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Ask for permission first -->
    <button id="start-button">Start AR</button>

    <!-- Hidden video for use as AR texture -->
    <video
      id="videoTexture"
      src="wahatvideo.mp4"
      crossorigin="anonymous"
      playsinline
      webkit-playsinline
      preload="auto"
      style="display: none;"
    ></video>

    <!-- MindAR AR scene -->
    <a-scene
      mindar-image="imageTargetSrc: targets.mind"
      embedded
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
      id="ar-scene"
      style="display: none"
    >
      <a-assets>
        <video
          id="myvideo"
          src="wahatvideo.mp4"
          preload="auto"
          crossorigin="anonymous"
          playsinline
          webkit-playsinline
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video
          id="target-video"
          src="#myvideo"
          width="1"
          height="0.5625"
          position="0 0 0"
          rotation="0 0 0"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      const startButton = document.getElementById("start-button");
      const scene = document.querySelector("a-scene");
      const videoEl = document.querySelector("#myvideo");

      startButton.addEventListener("click", async () => {
        scene.style.display = "block";
        const mindarComponent = scene.components["mindar-image"];
        await mindarComponent.start();
        startButton.style.display = "none";

        // Detect when the target appears
        scene.addEventListener("targetFound", () => {
          videoEl.play();
          videoEl.muted = false;
        });

        // Detect when the target disappears
        scene.addEventListener("targetLost", () => {
          videoEl.pause();
        });
      });
    </script>
  </body>
</html>
